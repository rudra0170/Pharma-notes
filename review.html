<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaNotes — Reviews</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="navbar" class="navbar"></nav>
  <div class="page">
    <h1 class="page-title">Reviews & Suggestions</h1>
    <p class="page-sub">Share your experience with PharmaNotes</p>

    <div class="review-form-box">
      <h2 class="review-form-title">Write a Review</h2>

      <div class="form-group">
        <input id="review-name" class="input" placeholder="Your Name" maxlength="40">
      </div>

      <div class="form-group">
        <label class="review-label">Your Rating</label>
        <div class="star-rating" id="star-rating">
          <span class="star" data-value="1">★</span>
          <span class="star" data-value="2">★</span>
          <span class="star" data-value="3">★</span>
          <span class="star" data-value="4">★</span>
          <span class="star" data-value="5">★</span>
        </div>
      </div>

      <div class="form-group">
        <textarea id="review-comment" class="textarea" rows="4" placeholder="Write your review or suggestion..." maxlength="500"></textarea>
      </div>

      <button id="review-btn" class="btn-primary" onclick="submitReview()">Submit Review</button>
    </div>

    <h2 class="review-list-title">What Students Say</h2>
    <div id="reviews-list" class="reviews-list">
      <p class="loading">Loading reviews...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    renderNavbar();
    loadReviews();
  </script>
</body>
</html>
